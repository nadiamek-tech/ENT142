:root{--wk:#C2410C;--wk-soft:rgba(194,65,12,.10);--wk-d:#FB923C;--wk-soft-d:rgba(251,146,60,.14)}

<script>
const {W,B} = Lecture;
const KEY = html=>`<div class="box exam"><b class="lbl">Remember for your project</b>${html}</div>`;
const F1='Schibsted Grotesk,Arial,sans-serif', FM='JetBrains Mono,monospace';

/* ---------- Scene 2: camera position (framing + eye line) ---------- */
const FRAME=`<svg class="svgfig" viewBox="0 0 640 300" role="img" aria-label="Left: landscape frame with rule-of-thirds grid, head and shoulders, eyes on the top third line. Right: side view, phone lens at eye level, about one arm's length away.">
<rect x="20" y="30" width="320" height="180" rx="8" fill="none" stroke="var(--ink)" stroke-width="2"/>
<line x1="126.7" y1="30" x2="126.7" y2="210" stroke="var(--line)" stroke-dasharray="4 4"/><line x1="233.3" y1="30" x2="233.3" y2="210" stroke="var(--line)" stroke-dasharray="4 4"/>
<line x1="20" y1="90" x2="340" y2="90" stroke="var(--wk)" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="20" y1="150" x2="340" y2="150" stroke="var(--line)" stroke-dasharray="4 4"/>
<circle cx="180" cy="95" r="34" fill="var(--wk)" opacity=".35"/><path d="M110 210 Q112 140 180 136 Q248 140 250 210Z" fill="var(--wk)" opacity=".35"/>
<circle cx="168" cy="90" r="3" fill="var(--ink)"/><circle cx="192" cy="90" r="3" fill="var(--ink)"/>
<text x="346" y="94" font-family="${FM}" font-size="10" fill="var(--wk)">eyes</text>
<text x="20" y="232" font-family="${F1}" font-size="13" font-weight="600" fill="var(--ink)">Framing · landscape, head + shoulders</text>
<text x="20" y="250" font-family="${FM}" font-size="10" fill="var(--muted)">eyes on the top third · small gap above the head</text>
<circle cx="440" cy="110" r="22" fill="var(--wk)" opacity=".35"/><rect x="424" y="134" width="32" height="70" rx="8" fill="var(--wk)" opacity=".35"/>
<rect x="590" y="88" width="8" height="44" rx="2" fill="var(--ink)"/><circle cx="594" cy="96" r="2.5" fill="var(--surface)"/>
<line x1="594" y1="132" x2="594" y2="204" stroke="var(--muted)" stroke-width="2"/><line x1="575" y1="204" x2="613" y2="204" stroke="var(--muted)" stroke-width="2"/>
<line x1="452" y1="106" x2="588" y2="96" stroke="var(--wk)" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="462" y1="160" x2="586" y2="160" stroke="var(--muted)" marker-start="url(#a13)" marker-end="url(#a13)"/>
<defs><marker id="a13" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>
<text x="524" y="178" text-anchor="middle" font-family="${FM}" font-size="10" fill="var(--muted)">about an arm's length</text>
<text x="390" y="232" font-family="${F1}" font-size="13" font-weight="600" fill="var(--ink)">Eye line · lens at eye level</text>
<text x="390" y="250" font-family="${FM}" font-size="10" fill="var(--muted)">look at the lens, not your face</text>
</svg>`;

/* ---------- Scene 3: the room ---------- */
const ROOM={
 'Light':[
  ['Face the light','Sit facing a window or lamp. The light falls on your face, not behind you.'],
  ['Avoid backlight','A bright window behind you turns your face into a dark shape. The phone exposes for the window.'],
  ['Soft, even light','Daylight through a window is softer than one ceiling lamp straight above your head.']],
 'Sound':[
  ['Quiet room','Close doors and windows. Switch off fans and air-conditioning noise if you can for 45 seconds.'],
  ['Soft room','Curtains, sofas and carpets reduce echo. Empty rooms and corridors echo.'],
  ['Close microphone','Keep the phone about an arm\'s length away. Wired or wireless earphones with a microphone help in noisy places.']]
};

/* ---------- Scene 4: one clean take ---------- */
const TAKE=`<svg class="svgfig" viewBox="0 0 640 120" role="img" aria-label="A 45-second timeline: hook 0 to 5 s, problem 5 to 15, solution 15 to 27, proof 27 to 38, ask 38 to 45.">
${[['Hook',0,5],['Problem',5,15],['Solution',15,27],['Proof',27,38],['Ask',38,45]].map(([t,a,b],i)=>{const x=20+a*600/45,w=(b-a)*600/45;return `<rect x="${x}" y="30" width="${w-3}" height="38" rx="5" fill="var(--wk)" opacity="${.35+i*.13}"/><text x="${x+w/2}" y="54" text-anchor="middle" font-family="${F1}" font-size="13" font-weight="700" fill="var(--ink)">${t}</text><text x="${x}" y="86" font-family="${FM}" font-size="10" fill="var(--muted)">${a}s</text>`}).join('')}
<text x="620" y="86" text-anchor="end" font-family="${FM}" font-size="10" fill="var(--muted)">45s</text>
<text x="20" y="112" font-family="${FM}" font-size="10" fill="var(--muted)">≈ 75–110 words at about 150 words per minute · no cuts, no music, no slides</text>
</svg>`;

/* ---------- Scene 5: file ---------- */
const FILE=`<table class="tbl"><thead><tr><th>Setting</th><th>Use</th><th>Why</th></tr></thead><tbody>
<tr><td>Resolution</td><td>1080p HD, 30 fps</td><td>Clear enough; 4K files are several times larger</td></tr>
<tr><td>Format</td><td>MP4 (H.264)</td><td>Plays on almost any laptop</td></tr>
<tr><td>iPhone</td><td>Camera › Formats › Most Compatible</td><td>Records H.264 instead of HEVC</td></tr>
<tr><td>Android</td><td>Camera settings › video size 1080p</td><td>Menu names differ by brand</td></tr>
<tr><td>File name</td><td>Your name and student ID</td><td>The marker finds it fast</td></tr>
<tr><td>Check</td><td>Play the file on a laptop before uploading</td><td>Sound, start and end are complete</td></tr></tbody></table>`;

/* ---------- Scene 6: mistakes ---------- */
const MIST=`<table class="tbl"><thead><tr><th>Mistake</th><th>What the viewer sees</th><th>Fix</th></tr></thead><tbody>
<tr><td>Window behind you</td><td>A dark face</td><td>Turn around: face the window</td></tr>
<tr><td>Watching your own face</td><td>Eyes looking down, away</td><td>Look at the lens; a small sticker beside it helps</td></tr>
<tr><td>Reading a script</td><td>Flat voice, no eye contact</td><td>Five keywords on a card behind the phone</td></tr>
<tr><td>58 seconds</td><td>Lost the delivery mark for time</td><td>Cut to about 110 words; drop adjectives first</td></tr></tbody></table>`;

/* ---------- Scene 7: activity ---------- */
const RUBRIC=`<table class="tbl"><thead><tr><th>Activity 2 criterion</th><th>Marks</th></tr></thead><tbody>
<tr><td>Hook</td><td>2</td></tr><tr><td>Problem + solution clarity</td><td>3</td></tr><tr><td>Proof / evidence</td><td>2</td></tr>
<tr><td>Delivery: voice, eye contact, within time</td><td>2</td></tr><tr><td>Clear ask</td><td>1</td></tr><tr><td><b>Total</b></td><td><b>10</b></td></tr></tbody></table>`;

/* ---------- Hooks ---------- */
const HOOKS={
 'Three hooks':[
  ['A question','"How much did you spend on lunch today?" The listener answers in their head.'],
  ['A surprising number','"Every evening, our campus cafés throw away good food." One true fact, said simply.'],
  ['A short story','"Last Monday, Sara skipped lunch: the queue was 30 minutes." One person, one moment.']]};
const SAY=`<table class="tbl"><thead><tr><th>Weak line</th><th>Strong line</th><th>Why</th></tr></thead><tbody>
<tr><td>"Our innovative, unique platform leverages AI…"</td><td>"An app that lists surplus meals at 6 pm for 5 AED."</td><td>Says what it does</td></tr>
<tr><td>"Many people have this problem."</td><td>"Students want cheap meals; cafés lose money after 6 pm."</td><td>Names who suffers</td></tr>
<tr><td>Four numbers in one sentence</td><td>"We tested it with 12 students: 9 would use it weekly."</td><td>One number, from your test</td></tr>
<tr><td>"Thank you for listening."</td><td>"Will you be our first pilot café?"</td><td>A clear ask</td></tr></tbody></table>`;

Lecture.mount({
  id:'ent142-w13', week:13, clo:2, course:'ENT 142', short:'Week 13 · Elevator Pitch Workshop (Part 1)',
  title:'Elevator Pitch Workshop (Part 1)',
  meta:'Pitch tips · 35-minute lecture, then practice',
  scenes:[
  { nav:'Start here', title:'Pitch tips in 35 minutes', minutes:2,
    narration:[`Seven tips, then you write and practise your own pitch. <span class="mono">Topics: 45-second structure · Hooks · Plain words · Voice and eyes · Camera · Video or Teams. CLO 2.</span>`],
    src:`Reading: <a href="activity-2.html">Activity 2 guide</a> · Byers, T., Dorf, R. C., &amp; Nelson, A. J. (2019). <em>Technology ventures: From idea to enterprise</em> (5th ed.). McGraw-Hill.`,
    fig:{label:`Today · 120 minutes`, build:el=>W.agenda(el,[[`Pitch tips`,35,'l'],[`Write your script`,25,'a'],[`Practise in pairs`,45,'a'],[`Choose: video or Teams`,10,'a'],[`Check`,5,'c']])} },

  { nav:'The formula', title:'Tip 1 · Five parts in 45 seconds', minutes:6,
    narration:[`An <b>elevator pitch</b> is your venture said in the time of a lift ride. Five parts, in order: Hook → Problem → Solution → Proof → Ask. About 75–110 words.`],
    src:`Activity 2 brief: 30–45 seconds, Hook → Problem → Solution → Proof → Ask.`,
    fig:{label:`45 seconds · five parts`, html:TAKE, caption:`Timings are a guide. The proof comes from your Project 1 test.`} },

  { nav:'The hook', title:'Tip 2 · Win the first five seconds', minutes:5,
    narration:[`The <b>hook</b> makes the listener want the next sentence. Choose one type. Never open with "Hi, my name is… and today I will…".`],
    fig:{label:`Three hooks · click a card`, build:el=>W.picker(el,HOOKS,'Select a hook type.')} },

  { nav:'Plain words', title:'Tip 3 · Say less, say it clearly', minutes:5,
    narration:[`Short sentences. No buzzwords. One number only: the strongest one, from your own test. End with an ask, not a thank-you.`],
    fig:{label:`Weak → strong · example venture`, html:SAY} },

  { nav:'Voice and eyes', title:'Tip 4 · Voice, pace and eye contact', minutes:5,
    narration:[`Speak a little slower than normal. Pause after the hook and before the ask. Look at the lens or the person, not the screen.`],
    fig:{label:`Delivery · four habits`, flow:[
      {t:'Pace',s:'≈150 words/min',d:'Slow down; cut words, not speed.'},
      {t:'Pause',s:'2 pauses',d:'After the hook, before the ask.'},
      {t:'Eyes',s:'lens',d:'Look at the lens, not your face.'},
      {t:'Card',s:'5 words',d:'One keyword per part, behind the phone.'}]} },

  { nav:'Camera', title:'Tip 5 · Camera and room in one minute', minutes:4,
    narration:[`Phone horizontal, lens at eye level, about an arm's length away. Face the light. Quiet room.`],
    fig:{label:`Framing · eye line`, html:FRAME, caption:`Plain background. Nothing moving behind you.`} },

  { nav:'Video or Teams', title:'Tip 6 · Two ways to pitch', minutes:4,
    narration:[`<b>Activity 1 (10%):</b> your script, saved as Word and uploaded. <b>Activity 2 (10%):</b> your pitch, recorded on video or live on Teams with Nadia (the call is recorded). Same marks either way.`],
    fig:{label:`Activity 2 · choose one`, flow:[
      {t:'A · Video',s:'phone or laptop',d:'One take, 30–45 s. Upload on Moodle by Tue 1 Dec, 23:59.'},
      {t:'B · Teams',s:'live, recorded',d:'Tell Nadia by Fri 27 Nov. Camera on, pitch once. Nothing to upload.'}],
      html:RUBRIC} },

  { nav:'Mistakes → fixes', title:'Tip 7 · Avoid four mistakes', kind:'review', minutes:2,
    narration:[`Check your practice take against this table.`],
    fig:{label:`Mistake → fix`, html:MIST} },

  { nav:'Check', title:'Check your understanding', kind:'check', minutes:5,
    narration:[`Four scenarios. One click per question.`],
    fig:{label:`4 questions`, build:el=>W.quiz(el,[
      {q:'Which opening is the strongest hook?',
       o:['"Hi, my name is Ali and today I will present our project."','"How much did you spend on lunch today?"','"Thank you for this opportunity."','"Our project is very innovative."'],a:1,
       why:'A question makes the listener think straight away. Introducing yourself, thanking or calling the idea innovative uses the first seconds without giving a reason to listen.'},
      {q:'Omar\'s pitch is clear but lasts 58 seconds. Which mark is most at risk?',
       o:['Hook','Proof','Delivery (includes within time)','Ask'],a:2,
       why:'Time sits inside delivery. His hook, proof and ask are judged on content, and the content is clear. The fix is to cut words, not to speak faster.'},
      {q:'Which line is the strongest proof?',
       o:['"Our idea is unique."','"We tested a paper prototype with 12 students; 9 asked to join."','"Food waste is a global problem."','"Our team is passionate."'],a:1,
       why:'Proof is evidence from a test: who, how many, what they did. "Unique" is a claim. Global food waste describes the problem. Passion is about the team, not the evidence.'},
      {q:'Maya is very shy and has no quiet room at home. What can she do for Activity 2?',
       o:['Skip Activity 2','Send a written script instead','Pitch live to Nadia on Teams; the call is recorded','Ask a friend to pitch for her'],a:2,
       why:'Option B is a recorded Teams pitch with the same marks. A written script is not a pitch, skipping loses 10%, and someone else\'s pitch is not her work.'}])} },

  { nav:'Takeaways', title:'Takeaways', minutes:1,
    narration:[`<ul><li>Hook → Problem → Solution → Proof → Ask, 30–45 seconds.</li><li>Plain words, one true number, a clear ask.</li><li>Script as Word = Activity 1. Video or Teams = Activity 2.</li></ul>`,
      `<b>Due Tuesday 1 December, 23:59:</b> Activity 1 · script (Word) and Activity 2 · video or Teams pitch. Teams: tell Nadia by Friday 27 November. <a class="btn" href="activity-2.html#s1">Write my script →</a>`,
      `<a class="btn" href="week-14.html">Next lecture · Week 14 · Elevator Pitch Workshop (Part 2) →</a>`] },
  ]
});
</script>
</body>
</html>
