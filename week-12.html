<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Week 12 · Elevator Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#B4235F;--wk-soft:rgba(180,35,95,.10);--wk-d:#F57FAE;--wk-soft-d:rgba(245,127,174,.14)}
.svgfig{width:100%;height:auto;display:block}
.pos{display:grid;gap:8px;font-family:var(--f-display);font-size:.9rem}
.pos label{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center}
.pos label span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pos input{width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit}
.pos .out{border-left:4px solid var(--wk);background:var(--wk-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.98rem;line-height:1.5}
.pos .out b{color:var(--wk)}
@media (max-width:560px){.pos label{grid-template-columns:minmax(0,1fr)}}
.tog{display:flex;gap:6px;margin-bottom:10px}
.tog button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;color:var(--ink)}
.tog button[aria-pressed="true"]{border-color:var(--wk);background:var(--wk);color:var(--on-wk)}
.script{font-family:var(--f-display);font-size:.95rem;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.script mark{background:none;color:inherit}
.script .tg{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--wk);border:1px solid var(--wk);border-radius:4px;padding:0 4px;margin-right:4px;white-space:nowrap}
.script .bad{text-decoration:underline wavy var(--bad);text-underline-offset:3px}
.wc{margin-top:10px;font-family:var(--f-display);font-size:.92rem}
.wc .bar{height:10px;background:var(--sunk);border-radius:4px;position:relative;margin-top:6px;overflow:hidden}
.wc .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--wk);border-radius:4px}
.wc .bar s{position:absolute;top:0;bottom:0;left:50%;width:23.3%;background:color-mix(in srgb,var(--good) 30%,transparent)}
</style>
</head>
<body>
<script src="assets/supports.js"></script>
<script src="assets/course.js"></script>
<script src="assets/onepage.js"></script>
<script src="assets/kb.js"></script>
<script src="assets/search-index.js"></script>
<script src="assets/assistant.js"></script>
<script src="assets/proto-bot.js"></script>
<script>
const {W,B} = Lecture;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-family="${o.m?'JetBrains Mono,monospace':'Schibsted Grotesk,Arial'}" font-weight="${o.w||400}" font-size="${o.s||13}" fill="${o.f||'var(--ink)'}">${t}</text>`;

/* ---------- Scene 2: time ruler ---------- */
const RULER=`<svg class="svgfig" viewBox="0 0 640 150" role="img" aria-label="Time ruler from 0 to 60 seconds. The target zone is 30 to 45 seconds, about 75 to 110 words.">
<rect x="30" y="60" width="580" height="18" rx="9" fill="var(--sunk)"/>
<rect x="${30+580*30/60}" y="60" width="${580*15/60}" height="18" rx="4" fill="var(--wk)"/>
${[0,15,30,45,60].map(s=>{const x=30+580*s/60;return `<line x1="${x}" y1="80" x2="${x}" y2="90" stroke="var(--muted)"/>${T(x,106,s+' s',{m:1,s:11,f:'var(--muted)'})}`}).join('')}
${T(30+580*37.5/60,48,'target · 30–45 s',{w:700,s:14,f:'var(--wk)'})}
${T(30+580*37.5/60,130,'≈ 75–110 words',{m:1,s:12})}
${T(30+580*12/60,48,'too short to prove anything',{s:12,f:'var(--muted)'})}
${T(30+580*54/60,130,'loses attention',{s:12,f:'var(--muted)'})}</svg>`;

/* ---------- Scene 3: five-part time budget ---------- */
const PARTS=[['Hook',5],['Problem',10],['Solution',10],['Proof',10],['Ask',5]];
const BUDGET=(()=>{let x=20;const tot=40,w=600;let s=`<svg class="svgfig" viewBox="0 0 640 120" role="img" aria-label="Time budget for a 40-second pitch: hook 5 s, problem 10 s, solution 10 s, proof 10 s, ask 5 s.">`;
 PARTS.forEach(([t,sec],i)=>{const ww=w*sec/tot;s+=`<rect x="${x+2}" y="30" width="${ww-4}" height="40" rx="6" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="1.5"/>${T(x+ww/2,56,t,{w:700,s:13})}${T(x+ww/2,92,sec+' s',{m:1,s:11,f:'var(--muted)'})}`;x+=ww;});
 return s+T(20,18,'A 40-second pitch · about 100 words',{a:'start',m:1,s:11,f:'var(--muted)'})+`</svg>`;})();

/* ---------- Scene 4: positioning statement builder ---------- */
const POSF=[['For','target customer','students on a tight budget'],['Who','need','want a cheap, decent dinner on campus'],['Name','product name','Second Plate'],['Is a','category','meal-reservation app'],['That','key benefit','sells each café’s surplus meals at a low price'],['Unlike','main alternative','vending machines and delivery apps'],['We','difference','turn food the café would waste into meals students can afford']];
function positioning(el){
  const key='ent142-w12-pos'; let v; try{v=JSON.parse(store.get(key)||'null')}catch(e){}
  if(!Array.isArray(v)) v=POSF.map(f=>f[2]);
  el.innerHTML=`<div class="pos">${POSF.map((f,i)=>`<label><span>${f[0]}</span><input type="text" data-i="${i}" value="${esc(v[i]||'')}" aria-label="${f[1]}" placeholder="${f[1]}"></label>`).join('')}<div class="out" aria-live="polite"></div><button type="button" class="btn ghost" style="justify-self:start">Clear for my venture</button></div>`;
  const out=el.querySelector('.out');
  const draw=()=>{ const b=i=>`<b>${esc(v[i]||'['+POSF[i][1]+']')}</b>`; out.innerHTML=`For ${b(0)} who ${b(1)}, ${b(2)} is a ${b(3)} that ${b(4)}. Unlike ${b(5)}, we ${b(6)}.`; store.set(key,JSON.stringify(v)); };
  el.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>{ v[+inp.dataset.i]=inp.value; draw(); }));
  el.querySelector('button').addEventListener('click',()=>{ v=POSF.map(()=>''); el.querySelectorAll('input').forEach(i=>i.value=''); draw(); });
  draw();
}

/* ---------- Scene 5: weak vs strong ---------- */
const WEAK=`<div class="script"><span class="bad">Hi, my name is Omar and our project is called Second Plate.</span> So basically it is an app, <span class="bad">it is really innovative and there is nothing like it in the market.</span> It helps the environment and also students and also cafés. Food waste is a big problem in the world. <span class="bad">We have many features like reservations, notifications, payments and a map.</span> <span class="bad">So yes, that is our idea. Thank you for listening.</span></div>
<p class="mono" style="color:var(--muted)">No hook · vague problem · unproved claim · feature list · no proof · no ask</p>`;
const STRONG=`<div class="script"><span class="tg">Hook</span>Every evening, campus cafés throw away meals that a hungry student would buy. <span class="tg">Problem</span>Students on tight budgets skip dinner, and cafés pay to dispose of good food. <span class="tg">Solution</span>Second Plate lists each café’s surplus meals at 6 pm for 5 dirhams; students reserve and collect in two taps. <span class="tg">Proof</span>In a one-week test with two cafés, 41 of 60 listed meals were collected, and 9 of 12 testers said they would use it weekly. <span class="tg">Ask</span>We are looking for one more campus café for a four-week pilot. Can we meet on Thursday?</div>
<p class="mono" style="color:var(--muted)">Fictional example · numbers are illustrative · 89 words ≈ 36 s</p>`;
function compare(el){
  el.innerHTML=`<div class="tog" role="group" aria-label="Choose a pitch"><button type="button" aria-pressed="true" data-k="w">Weak pitch</button><button type="button" aria-pressed="false" data-k="s">Strong pitch</button></div><div class="cmp"></div>`;
  const out=el.querySelector('.cmp'), bs=el.querySelectorAll('.tog button');
  const show=k=>{ bs.forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k)); out.innerHTML=k==='w'?WEAK:STRONG; };
  bs.forEach(b=>b.addEventListener('click',()=>show(b.dataset.k))); show('w');
}

/* ---------- Scene 6: mistakes ---------- */
const FIX=`<table class="tbl"><thead><tr><th>Mistake</th><th>Fix</th></tr></thead><tbody>
<tr><td>Opening with your name and project title</td><td>Open with the hook; your name can go on screen or at the end.</td></tr>
<tr><td>Listing features</td><td>Give one benefit the user feels.</td></tr>
<tr><td>Ending with “Thank you”</td><td>End with a clear ask: who, what, when.</td></tr></tbody></table>`;

/* ---------- Scene 7: script + word counter ---------- */
function scriptLab(el){
  const id='ent142-w12-script';
  W.worksheet(el,{id,title:'ENT 142 · Week 12 · Elevator pitch script',fields:[
    {l:'Hook: one sentence that makes them listen',rows:1},
    {l:'Problem: who suffers, and how?',rows:2},
    {l:'Solution: what you offer, in one benefit',rows:2},
    {l:'Proof: one piece of evidence from Project 1',hint:'Test result, user quote, data.',rows:2},
    {l:'Ask: what do you want from the listener?',rows:1},
    {l:'Full script (about 100 words)',hint:'Join the five parts. Read it aloud with a timer.',rows:6}]});
  const ta=el.querySelector('#'+id+'-5'); if(!ta) return;
  const wc=W.h('div',{class:'wc','aria-live':'polite'}); ta.after(wc);
  const upd=()=>{ const n=(ta.value.trim().match(/\S+/g)||[]).length; const sec=Math.round(n/2.5);
    const msg=n===0?'Word counter: start writing.':n<75?'Short: add proof or a clearer ask.':n<=110?'Good length for 30–45 seconds.':'Too long: cut features and filler words.';
    wc.innerHTML=`<b>${n} words</b> ≈ ${sec} s at a normal pace · ${msg}<div class="bar"><s></s><i style="width:${Math.min(n/150,1)*100}%"></i></div>`; };
  ta.addEventListener('input',upd); upd();
}

Lecture.mount({
  id:'ent142-w12', week:12, clo:2, course:'ENT 142', short:'Week 12 · Elevator Pitch',
  title:'Elevator Pitch',
  meta:'Moore (1991), positioning statement · 2-hour lab',
  scenes:[
  { nav:'Start here', title:'Can you explain your idea before the lift doors open?', minutes:5,
    narration:[`Build a 30–45 second pitch for your venture or your own idea. <span class="mono">Topics: What an elevator pitch is · Hook → Problem → Solution → Proof → Ask · Positioning statement · Writing the script. CLO 2.</span>`],
    src:`Reading: Moore, G. A. (1991). <em>Crossing the chasm</em>. HarperBusiness (positioning statement). · Activity 2 guide: <a href="activity-2.html">activity-2.html</a>.`,
    fig:{label:`Today's lab · 120 minutes`, build:el=>W.agenda(el,[[`Start here`,5,'l'],[`30 seconds`,5,'l'],[`What a pitch is`,10,'l'],[`Five parts`,15,'l'],[`Positioning`,15,'l'],[`Weak vs strong`,10,'l'],[`Mistakes → fixes`,5,'l'],[`Write your script`,40,'a'],[`Check`,10,'c'],[`Takeaways`,5,'l']])} },

  { nav:'30 seconds', title:'You have 30 seconds', minutes:5,
    narration:[`At a career fair, an investor stops at your stand. She says: “You have 30 seconds. What is it?”`],
    think:`Say your first sentence in your head. Would it make her stay, or move to the next stand?` },

  { nav:'What a pitch is', title:'An elevator pitch is a short spoken case', minutes:10,
    narration:[`An <b>elevator pitch</b> is a short spoken summary of who you help, how, and what you want. It lasts <b>30–45 seconds</b>: about 75–110 words at a normal speaking pace. Its goal is a next conversation, not a deal.`],
    fig:{label:`Time is the constraint`, html:RULER} },

  { nav:'Five parts', title:'Hook → Problem → Solution → Proof → Ask', minutes:15, wide:true,
    narration:[`Five parts, in this order. This is the structure and the marking of Activity 2 (/10). Press Play.`],
    fig:{label:`Five parts · press Play`, flow:[
      {t:'Hook',s:'2 marks',d:'One sentence that creates curiosity: a surprising fact, a question or a scene.'},
      {t:'Problem',s:'3 marks with solution',d:'Who suffers, and how. Specific, not “a big problem in the world”.'},
      {t:'Solution',s:'',d:'What you offer and the one benefit the user feels.'},
      {t:'Proof',s:'2 marks',d:'Evidence: your Project 1 test result, a user quote, open data.'},
      {t:'Ask',s:'1 mark',d:'What you want: a meeting, a pilot partner, feedback, funding.'}],
      html:BUDGET, caption:`Delivery (voice, eye contact, within time) adds 2 marks.`} },

  { nav:'Positioning', title:'Positioning statement: the core of your pitch', minutes:15, wide:true,
    narration:[`Moore (1991) proposed a one-sentence <b>positioning statement</b>: target customer, need, category, benefit, main alternative and difference. Write it first; the pitch grows from it. Edit the example for your venture.`],
    src:`Moore, G. A. (1991). <em>Crossing the chasm</em>. HarperBusiness. Template adapted.`,
    fig:{label:`Positioning builder · saves in your browser`, build:positioning} },

  { nav:'Weak vs strong', title:'Same venture: weak pitch vs strong pitch', minutes:10, wide:true,
    narration:[`Both pitches describe Team Second Plate (fictional). Switch between them. Notice what the strong one removes.`],
    fig:{label:`Compare · click to switch`, build:compare} },

  { nav:'Mistakes → fixes', title:'Three common pitch mistakes', kind:'review', minutes:5,
    narration:[`The first and last sentences carry most of the impact.`],
    fig:{label:`Mistake → fix`, html:FIX} },

  { nav:'Write your script', title:'Activity · Write your 100-word script', kind:'activity', minutes:40, wide:true,
    narration:[`Write one sentence per part, then join them. Read it aloud with a timer: 30–45 seconds.`,
      `This is the script for <b>Activity 2 · Video pitch</b>, due <b>Tuesday 24 November, 23:59</b> on Moodle. See the <a href="activity-2.html">Activity 2 guide</a>.`],
    fig:{label:`Pitch script · saves in your browser`, build:scriptLab} },

  { nav:'Check', title:'Check your understanding', kind:'check', minutes:10,
    narration:[`Five questions. One attempt each.`],
    fig:{label:`Quiz · 5 questions`, build:el=>W.quiz(el,[
      {q:`A student’s script is 170 words. What is the best fix?`,
       o:[`Speak faster to fit 45 seconds`,`Cut the feature list and keep one benefit`,`Remove the proof to save time`,`Keep it; longer pitches show more effort`],a:1,
       why:`Cutting features keeps all five parts within 75–110 words. Speaking faster hurts delivery. Removing proof loses 2 marks. Length beyond 45 seconds loses the delivery mark and attention.`},
      {q:`Which is the strongest hook?`,
       o:[`Hello, my name is Sara and I am a CUD student.`,`Our project is called Second Plate.`,`Every evening, campus cafés throw away meals a hungry student would buy.`,`Food waste is a big problem in the world.`],a:2,
       why:`It creates a concrete, surprising picture tied to the problem. A name or project title gives no reason to listen. A global statement is vague and familiar.`},
      {q:`Which sentence is proof?`,
       o:[`We are very passionate about this idea.`,`In a one-week test, 41 of 60 listed meals were collected.`,`Our app is innovative and unique.`,`Food waste affects many countries.`],a:1,
       why:`Proof is evidence from your own test or data. Passion is not evidence. “Innovative and unique” is an unproved claim. A general fact describes the problem, not your solution working.`},
      {q:`“For students on a budget, Second Plate is an app that sells surplus café meals cheaply.” What is missing from Moore’s positioning statement?`,
       o:[`The target customer`,`The product category`,`The main alternative and your difference`,`The benefit`],a:2,
       why:`There is no “Unlike [alternative], we [difference]”. The target (students on a budget), category (an app) and benefit (cheap surplus meals) are present.`},
      {q:`Which ask is clearest for an investor at a career fair?`,
       o:[`Thank you for listening.`,`Please support us.`,`We are looking for 20 minutes next week to show you our pilot results. Can I book a time?`,`Let us change the world together.`],a:2,
       why:`It names what, how long and when, and ends with a question. “Thank you” has no ask. “Support us” is vague. A slogan gives the listener nothing to do.`}])} },

  { nav:'Takeaways', title:'Takeaways', minutes:5,
    narration:[`<ul><li>30–45 seconds, about 75–110 words, one goal: the next conversation.</li><li>Hook → Problem → Solution → Proof → Ask.</li><li>Write the positioning statement first; prove it with Project 1 evidence.</li></ul>`,
      `<b>Next week:</b> bring your script and your phone; we film practice takes.`,
      `<a class="btn" href="week-13.html">Next lecture · Week 13 · Elevator Pitch Workshop (Part 1) →</a>`] },
  ]
});
</script>
</body>
</html>
