<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Week 3 · Lean Startups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#2F55C8;--wk-soft:rgba(47,85,200,.10);--wk-d:#8AA6FF;--wk-soft-d:rgba(138,166,255,.14)}
.pv{display:grid;gap:10px;font-family:var(--f-display);font-size:.92rem}
.pv .r{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px;align-items:center}
.pv input{width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit}
.pv .verdict{font-size:1.2rem;font-weight:800}
.pv svg{width:100%;height:auto}
</style>
</head>
<body>
<script src="assets/course.js"></script>
<script>
const {W,B} = Lecture;
const KEY = html=>`<div class="box exam"><b class="lbl">Remember for your project</b>${html}</div>`;

const MVP={
 'Test demand':[
  ['Landing page','One web page that describes the product as if it exists, with a “Join the waiting list” button. Count sign-ups.<br><br><b>Student example:</b> a free Google Sites or Canva page for a surplus-meal app, shared in 3 class groups; target: 50 sign-ups in a week.'],
  ['Explainer video','A short video showing how the product would work.<br><br><b>Real case:</b> Dropbox founder Drew Houston made a short demo video; he said the beta waiting list grew from 5,000 to 75,000 people overnight (TechCrunch, 2011).']],
 'Deliver by hand':[
  ['Concierge','You deliver the service personally to a few customers. No technology.<br><br><b>Real case:</b> in 2007 Airbnb\'s founders rented air mattresses in their San Francisco apartment to design-conference visitors when the city\'s hotels were full: “Air Bed and Breakfast” (Wharton, Knowledge@Wharton).'],
  ['Wizard of Oz','Customers think it is automated; a person does the work behind the screen.<br><br><b>Real case:</b> Zappos\' founder posted photos of shoes from local stores online; when someone ordered, he bought the pair and shipped it himself (Ries, 2011).']],
 'Ship the smallest product':[
  ['Single-feature product','Build only the one feature that solves the core problem.<br><br><b>Real case:</b> Buffer launched on 30 November 2010 “in the most lean and minimal way possible”, supporting only Twitter; the first customer paid four days later (Buffer, 2013).']]
};

function pivot(el){
  el.innerHTML=`<div class="pv"><div class="r"><label for="pv-t">Target (e.g. sign-ups you need)</label><input id="pv-t" type="number" value="50"></div>
   <div class="r"><label for="pv-r">Result of your MVP</label><input id="pv-r" type="number" value="31"></div>
   <div id="pv-svg"></div><div class="feedback" id="pv-o"></div></div>`;
  const t=el.querySelector('#pv-t'), r=el.querySelector('#pv-r');
  const upd=()=>{ const T=+t.value||0, R=+r.value||0, ratio=T?R/T:0; const mx=Math.max(T,R,1);
    el.querySelector('#pv-svg').innerHTML=`<svg viewBox="0 0 400 90" role="img" aria-label="Result versus target"><rect x="70" y="10" width="${T/mx*320}" height="24" rx="4" fill="var(--line)"/><text x="0" y="27" font-family="Schibsted Grotesk,Arial" font-size="13" fill="var(--ink)">Target</text><text x="${76+T/mx*320}" y="27" font-family="Schibsted Grotesk,Arial" font-size="12" fill="var(--muted)">${T}</text><rect x="70" y="50" width="${R/mx*320}" height="24" rx="4" fill="${ratio>=1?'var(--good)':ratio>=.5?'var(--warn)':'var(--bad)'}"/><text x="0" y="67" font-family="Schibsted Grotesk,Arial" font-size="13" fill="var(--ink)">Result</text><text x="${76+R/mx*320}" y="67" font-family="Schibsted Grotesk,Arial" font-size="12" fill="var(--muted)">${R}</text></svg>`;
    el.querySelector('#pv-o').innerHTML= ratio>=1?`<span class="verdict" style="color:var(--good)">Persevere</span><br>The hypothesis held. Run the next, riskier experiment.`:ratio>=.5?`<span class="verdict" style="color:var(--warn)">Iterate</span><br>Partly confirmed (${Math.round(ratio*100)}% of target). Change one thing (message, price, customer) and test again.`:`<span class="verdict" style="color:var(--bad)">Pivot</span><br>Far below target (${Math.round(ratio*100)}%). Change a core assumption: the customer, the problem or the solution.`; };
  t.addEventListener('input',upd); r.addEventListener('input',upd); upd();
}

Lecture.mount({
  id:'ent142-w3', week:3, clo:'1, 3', course:'ENT 142', short:'Week 3 · Lean Startups',
  title:'Lean Startups', meta:'Byers et al (2019). Ch. 4, HBR · 2-hour lab',
  scenes:[
  { nav:'Start here', title:'How do we learn what customers want before time runs out?', minutes:5,
    narration:[
     `Your team has one idea. This week you plan the cheapest experiment that tells you whether people want it.`,
     `Syllabus topics: <strong>Lean Startups</strong> · <strong>Introduction to Lean Startups</strong> · <strong>Minimum Viable Product (MVP)</strong>. CLO 1 and CLO 3.`],
    src:`Reading: Byers et al (2019). Ch. 4 · Blank, S. (2013). Why the lean start-up changes everything. <em>Harvard Business Review</em>, 91(5).`,
    fig:{label:`Today's lab · 120 minutes`, build:el=>W.agenda(el,[[`Start here`,5,'l'],[`Hook`,5,'a'],[`Lean startup in one loop`,15,'l'],[`What an MVP is`,15,'l'],[`MVP or not?`,10,'a'],[`Pivot or persevere`,10,'l'],[`Design your MVP experiment`,40,'a'],[`Key takeaways`,15,'l'],[`Exit check`,5,'c']])} },

  { nav:'Hook', title:'Hook · What kills most new ventures?', kind:'activity', minutes:5,
    narration:[`Vote.`],
    fig:{label:`Vote`, build:el=>W.poll(el,{q:'The biggest risk for a new venture is…',opts:['a competitor copies it','building something nobody wants','the logo is weak','too little funding at the start'],reveal:i=>(i===1?'<b>Yes.</b> ':'<b>Suggested: B.</b> ')+'Lean startup exists to reduce exactly this risk: test demand before you build.'})} },

  { nav:'Lean startup', title:'Introduction to lean startups', minutes:15,
    narration:[
     B.plain(`A lean startup treats every plan as a set of <b>guesses (hypotheses)</b> and tests them quickly with real customers. Steve Blank (2013) summarises it as experimentation over elaborate planning, customer feedback over intuition, and iterative design over big up-front design.`),
     `The engine is one loop, from Eric Ries (2011): <strong>Build → Measure → Learn</strong>. Each loop should be short and cheap.`,
     B.ex(`Guess: “students will pay 15 AED for a surplus meal.” Build: a landing page with the offer. Measure: 31 sign-ups in a week. Learn: interest is real but below the target of 50; test a lower price next week.`)],
    src:`Ries, E. (2011). <em>The lean startup</em>. Crown Business. · Blank, S. (2013). <em>Harvard Business Review</em>.`,
    fig:{label:`Build → Measure → Learn`, flow:[
      {t:'Hypothesis',s:'the guess',d:'We believe [customer] will [behaviour] because [reason].'},
      {t:'Build',s:'the MVP',d:'The smallest thing that tests the guess.'},
      {t:'Measure',s:'one metric',d:'Sign-ups, orders, repeat use: a number decided in advance.'},
      {t:'Learn',s:'decide',d:'Persevere, iterate or pivot. Then start the next loop.'}]} },

  { nav:'MVP', title:'Minimum Viable Product (MVP)', minutes:15, wide:true,
    narration:[
     B.plain(`An <b>MVP</b> is the version of a new product that lets a team collect the maximum amount of validated learning about customers with the least effort (Ries, 2011). It is an <b>experiment</b>, not a small version of the final product.`),
     `Five common MVP types. Click each for a real case.`],
    fig:{label:`MVP types · click for a case`, build:el=>W.picker(el,MVP,'Select an MVP type.')} },

  { nav:'MVP or not?', title:'Activity · MVP or not?', kind:'activity', minutes:10,
    narration:[`Sort each plan. Then reveal and discuss.`],
    fig:{label:`Sort`, build:el=>W.sort(el,{buckets:['Good MVP','Not an MVP'],items:[
      {t:`A one-page website with a “Reserve your first meal” button, shared for one week`,a:0,why:`Cheap, fast, measures real behaviour.`},
      {t:`Spending 6 weeks building a full app with login, payments and maps`,a:1,why:`Too slow and expensive; nothing is learned until it ships.`},
      {t:`Running the tutoring service by hand for 5 children for two weekends`,a:0,why:`Concierge MVP: learns what the service really needs.`},
      {t:`Asking friends “Would you use this?”`,a:1,why:`Opinions, not behaviour. Friends are polite.`},
      {t:`A 60-second video of how the product works, with a sign-up link`,a:0,why:`Explainer-video MVP; measures interest.`}]})} },

  { nav:'Pivot or persevere', title:'Pivot, iterate or persevere?', minutes:10,
    narration:[
     `Before you run an MVP, write down a <strong>target number</strong>. After the test, compare the result with the target and decide.`,
     B.ex(`Target 50 sign-ups, result 31: <b>iterate</b> (change one thing). Result 8: <b>pivot</b> (change the customer, problem or solution). Result 65: <b>persevere</b>.`)],
    notes:[`The 50% and 100% thresholds in the tool are a teaching rule of thumb, not a standard.`],
    fig:{label:`Try different numbers`, build:pivot, caption:`Rule of thumb for this course: ≥100% persevere, 50–99% iterate, below 50% pivot.`} },

  { nav:'Design your MVP', title:'Activity · Design your MVP experiment', kind:'activity', minutes:40,
    narration:[
     `Fill in the experiment card for your team's idea. Run the MVP before Week 5 if you can: the result becomes evidence for Steps 4 and 8 of the <a href="project-1.html">Project 1 Lab</a>.`,
     B.ex(`<b>We believe</b> university students near campus <b>will</b> reserve a discounted evening meal. <b>MVP:</b> landing page shared in 3 class groups for 7 days. <b>We will know we are right when</b> 50 students sign up.`)],
    fig:{label:`Experiment card · saves in your browser`, build:el=>W.worksheet(el,{id:'ent142-w3-mvp',title:'ENT 142 · Week 3 · MVP experiment',fields:[
      {l:'We believe [customer]…',rows:1},{l:'…will [behaviour]…',rows:1},{l:'…because [reason]',rows:2},
      {l:'MVP type and what we will build',hint:'Landing page, explainer video, concierge, Wizard of Oz or single feature',rows:2},
      {l:'Metric and target number',hint:'Decide before the test',rows:1},{l:'Result',rows:1},{l:'Decision: persevere, iterate or pivot? Why?',rows:2}]})} },

  { nav:'Key takeaways', full:true, title:'Key takeaways · Week 3', kind:'review', minutes:15,
    narration:[KEY(`<ul><li>Lean startup: test guesses with customers before building.</li><li>Build → Measure → Learn, in short loops.</li><li>MVP = maximum validated learning with the least effort.</li><li>Five MVP types: landing page, explainer video, concierge, Wizard of Oz, single feature.</li><li>Set a target number <b>before</b> the test; then persevere, iterate or pivot.</li></ul>`)],
    fig:{mindmap:{center:'Lean startup',branches:[
      {t:'Mindset',items:['Plans are guesses','Experiment over planning']},
      {t:'Loop',items:['Build','Measure','Learn']},
      {t:'MVP',items:['Learning, least effort','An experiment, not a mini product']},
      {t:'MVP types',items:['Landing page · video','Concierge · Wizard of Oz','Single feature']},
      {t:'Decide',items:['Target set in advance','Persevere · iterate · pivot']}]}} },

  { nav:'Exit check', title:'Exit check', kind:'check', minutes:5,
    narration:[`Five questions.`,`<strong>Before Week 4:</strong> read the UN SDGs (sdgs.un.org/goals), Qian et al., (2024) and Bridge et al 2020 Ch1.`],
    fig:{label:`Five questions`, build:el=>W.quiz(el,[
      {q:`The lean startup loop is…`,o:[`Plan → Build → Sell`,`Build → Measure → Learn`,`Idea → Logo → Launch`,`Research → Write → Submit`],a:1,why:`Ries (2011).`},
      {q:`An MVP is best described as…`,o:[`a cheap final product`,`an experiment for maximum learning with least effort`,`a prototype for investors only`,`the first version with all features`],a:1,why:`It exists to learn.`},
      {q:`Airbnb's founders first tested their idea by…`,o:[`building an app`,`renting air mattresses in their apartment during a conference`,`buying a hotel`,`running ads`],a:1,why:`A concierge-style MVP in 2007.`},
      {q:`Target 50, result 27. The course rule of thumb says…`,o:[`persevere`,`iterate`,`pivot`,`stop the project`],a:1,why:`27/50 = 54%: change one thing and test again.`},
      {q:`“Would you use this?” asked to friends is weak evidence because…`,o:[`it is too slow`,`it measures polite opinions, not behaviour`,`it is too expensive`,`friends are not customers ever`],a:1,why:`Measure what people do.`}])} }
  ]
});
</script>
</body>
</html>
