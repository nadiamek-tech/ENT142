<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Video Pitch · Activities 1 and 2 · ENT 142</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<link rel="stylesheet" href="assets/portal.css">
<link rel="stylesheet" href="assets/deck.css">
<style>:root{--wk:#C2185B;--wk-soft:rgba(194,24,91,.09);--wk-d:#F48FB1;--wk-soft-d:rgba(244,143,177,.15)}
.phone{width:min(240px,70%);aspect-ratio:9/16;margin:0 auto;border-radius:28px;border:8px solid #1d2430;background:linear-gradient(#cfd8e6,#eef2f7);position:relative;overflow:hidden}
.phone .face{position:absolute;left:50%;top:22%;width:42%;aspect-ratio:1;border-radius:50%;background:#c9a27e;transform:translateX(-50%)}
.phone .body{position:absolute;left:50%;top:52%;width:80%;height:60%;border-radius:40% 40% 0 0;background:#5a6c8a;transform:translateX(-50%)}
.phone .third{position:absolute;left:0;right:0;border-top:1px dashed rgba(29,36,48,.35)}
.phone .rec{position:absolute;top:10px;left:10px;font:700 .7rem var(--f-mono);color:#c2185b}
.meta2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin:0 0 12px}.meta2 .full{grid-column:1/-1}.meta2 label,.rt{display:block;font:600 .74rem var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:#6b6158;margin:0 0 3px}
.seg2{display:flex;gap:6px;flex-wrap:wrap}.seg2 button{flex:1;min-width:130px;font:700 .9rem var(--f-display);border:1.5px solid #e2d6c9;background:#fff;color:#1e1a16;border-radius:10px;padding:9px 10px;cursor:pointer}.seg2 button[aria-pressed=true]{background:var(--wk);border-color:var(--wk);color:#fff}
@media (max-width:520px){.meta2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="hub" data-cur="pitch"></div>
<main class="deck" id="deck"></main>
<nav class="dnav" aria-label="Slides"><div class="dnav-in"><button type="button" class="nb prev">← Back</button><div class="dots" id="dots"></div><span class="pos" id="pos"></span><button type="button" class="nb next">Next →</button></div></nav>
<script src="assets/supports.js"></script>
<script src="assets/course.js"></script>
<script src="assets/kb.js"></script>
<script src="assets/search-index.js"></script>
<script src="assets/assistant.js"></script>
<script src="assets/professor.js"></script>
<script src="assets/course-info.js"></script>
<script src="assets/portal.js"></script>
<script src="assets/deck.js"></script>
<script>
Portal.header('pitch');
const {field:F,esc}=Deck;
const A2=COURSE.assess.find(a=>a.id==='a2')||{};
const MOODLE=(A2.submit||{}).link||'';
const A1=COURSE.assess.find(a=>a.id==='a1')||{};
const MOODLE1=(A1.submit||{}).link||'';
const ROUTES=['Record a video (Option A)','Pitch live on Teams (Option B)'];
const ROUTE=()=>`<label class="rt">How I will pitch</label><div class="seg2" role="group" aria-label="How I will pitch">${ROUTES.map((r,i)=>`<button type="button" data-route="${i}" aria-pressed="${Deck.get('route')===r}">${i?'🎦 Teams meeting':'📱 Record video'}</button>`).join('')}</div>`;
function loadDocx(){ return window.docx?Promise.resolve(window.docx):new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='assets/vendor/docx.umd.js'; sc.onload=()=>res(window.docx); sc.onerror=rej; document.head.appendChild(sc); }); }
async function saveWord(){ const g=k=>Deck.get(k)||''; const n=['p0','p1','p2','p3','p4'].reduce((a,k)=>a+Deck.words(g(k)),0);
  const name=g('nm')||'Student', id=g('id')||'ID';
  const parts=[['Student',`${name} · ${id}`],['Venture',g('vn')],['How I will pitch',g('route')||'Not chosen yet'],...PARTS.map(([t],i)=>[t,g('p'+i)]),['Length',`${n} words ≈ ${Math.round(n/150*60)} seconds`]];
  try{ const {Document,Packer,Paragraph,TextRun,HeadingLevel}=await loadDocx();
    const kids=[new Paragraph({text:'ENT 142 · Activity 1 · Pitch script',heading:HeadingLevel.TITLE}),new Paragraph({children:[new TextRun({text:'Instructor: Nadia',italics:true})],spacing:{after:240}})];
    parts.forEach(([h,t])=>{ kids.push(new Paragraph({text:h,heading:HeadingLevel.HEADING_2,spacing:{before:200,after:80}})); String(t||'').split(/\n+/).forEach(x=>kids.push(new Paragraph({children:[new TextRun(x)]}))); });
    const blob=await Packer.toBlob(new Document({creator:'ENT 142 student',sections:[{children:kids}]}));
    const fname=`${name}_${id}_ENT142_Activity1_Script.docx`.replace(/[^\w\-. ]+/g,'').replace(/\s+/g,'_');
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare){ try{ const f=new File([blob],fname,{type:blob.type}); if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:fname}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },60000);
  }catch(e){ Deck.doc(`${name} ${id} ENT142 Activity 1 Pitch Script`,parts); } }
const MODE=`<div class="mode" role="group" aria-label="Template or example"><button type="button" data-mode="me" aria-pressed="true">My script</button><button type="button" data-mode="ex" aria-pressed="false">Example</button></div>`;
const PARTS=[
 ['Hook','≈ 5 s','One surprising fact or question.','Every evening, our campus cafés throw away good food.'],
 ['Problem','≈ 8 s','Who suffers, and how much.','Students want cheap meals, and cafés lose money on food they cannot sell after 6 pm.'],
 ['Solution','≈ 10 s','What you offer, in one clear sentence.','Second Plate is an app that lists surplus meals at 6 pm for 5 AED, collected in ten minutes.'],
 ['Proof','≈ 10 s','One number from your test or data.','We tested a paper version with 12 students: 9 said they would use it every week.'],
 ['Ask','≈ 5 s','What you want from the listener.','We are looking for one campus café to run a four-week pilot with us. Will you be the first?']];
const ids=PARTS.map((_,i)=>'p'+i);
const script=ex=>PARTS.map((p,i)=>ex?p[3]:(Deck.get('p'+i)||'')).filter(Boolean).join('\n');
const SL=[
 {nav:'What',html:()=>`<div><div class="kick">Activities 1 and 2 · Week 13</div><h2>A 30–45 second pitch</h2>
  <p class="what">Pitch your team venture, or your own idea. Record it with your phone, or pitch live to Nadia on Teams.</p>
  <div class="chips"><span>Individual</span><span>Activity 1 · <b>script</b> · <b>10%</b></span><span>Activity 2 · <b>video or Teams</b> · <b>10%</b></span><span>Due <b>Tue 1 Dec</b></span><span>CLO <b>2</b></span></div>
  <div class="acts"><button type="button" class="b" data-go="1">Write my script →</button><a class="b g" href="week-12.html">Week 12 · Elevator Pitch</a></div></div>
  <div class="vis"><span class="lbl">What you hand in</span><div class="paper" style="justify-items:center"><div class="phone" aria-hidden="true"><span class="rec">● REC 0:41</span><div class="third" style="top:33%"></div><div class="third" style="top:66%"></div><div class="face"></div><div class="body"></div></div><div class="wc">1 · your script as a Word file · 2 · your video, or your recorded Teams pitch</div></div></div>`},
 {nav:'Script',part:'1',html:()=>`<div><div class="kick">Step 1 <span class="mk">Activity 1 · 10%</span></div><h2>Write the script</h2>
  <p class="what">Five parts, one or two sentences each. Speak at about 150 words a minute, so 75–110 words fits 30–45 seconds.</p>
  <ol class="how"><li>Write it as you speak: short sentences, no slides.</li><li>Keep only one number, the strongest.</li><li>End with a clear ask.</li></ol>
  <div class="acts"><button type="button" class="b" id="saveW">Save as Word ⤓</button>${MOODLE1?`<a class="b g" href="${esc(MOODLE1)}" target="_blank" rel="noopener">Upload script on Moodle ↗</a>`:`<span class="b g" aria-disabled="true">Moodle link coming soon</span>`}<button type="button" class="b g" data-go="2">Practise it →</button></div>
  <p class="wc" style="text-align:left">Save as Word, then upload the file on Moodle: that is Activity 1.</p></div>
  <div class="vis"><div class="vhead"><span class="lbl">Script · write on it</span>${MODE}</div><div class="paper"><div class="meta2"><div><label>Name</label>${F('nm',{ph:'Full name',rows:1})}</div><div><label>Student ID</label>${F('id',{ph:'Student ID',rows:1})}</div><div class="full"><label>Venture</label>${F('vn',{ph:'Team venture or your own idea',rows:1,ex:'Second Plate'})}</div><div class="full">${ROUTE()}</div></div><div class="gx">${PARTS.map(([t,s,q,ex],i)=>`<div class="r"><span>${i+1}</span><div><label>${t} · ${s} · ${q}</label>${F('p'+i,{ph:q,rows:2,ex})}</div></div>`).join('')}</div></div><span class="wc" id="wc"></span><div class="acts" style="margin-top:10px"><button type="button" class="b" onclick="saveWord()">Save as Word ⤓</button></div></div>`,
  after:el=>{ el.querySelector('#saveW').onclick=saveWord; el.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{ Deck.set("route",ROUTES[+b.dataset.route]); el.querySelectorAll('[data-route]').forEach(x=>x.setAttribute('aria-pressed',x===b)); }); }},
 {nav:'Practise',part:'2',html:()=>`<div><div class="kick">Step 2</div><h2>Practise with the timer</h2>
  <p class="what">Read your script aloud while the bar runs. Stop between 30 and 45 seconds.</p>
  <ol class="how"><li>Practise three times. Then put the text away and try once from memory.</li><li>Pause after the hook and before the ask.</li><li>Look at the lens, not the screen.</li></ol>
  <div class="acts"><button type="button" class="b" id="go">▶ Start the timer</button><button type="button" class="b g" id="useEx">Use the example script</button></div></div>
  <div class="vis"><span class="lbl">Prompter</span><div class="paper"><div class="tlab"><span id="tt">0.0 s</span><span>30 s · 45 s</span></div><div class="tbar"><i id="tb"></i></div><div class="prompt" id="pr"></div></div></div>`,
  after:el=>prompter(el)},
 {nav:'Choose',part:'3',html:()=>`<div><div class="kick">Step 3</div><h2>Choose how you pitch</h2>
  <p class="what">Same pitch, same marks. You chose one in your script; you can still change it.</p>
  <div class="acts"><button type="button" class="b" data-go="4">Option A · Record →</button><button type="button" class="b g" data-go="5">Option B · Teams →</button></div></div>
  <div class="vis"><span class="lbl">Two options</span><div class="paper"><div class="gx">
   <div class="r"><span>A</span><div><b>Record a video</b><p class="wc" style="text-align:left;margin:4px 0 0">Your phone or laptop. One take. Upload the file on Moodle.</p></div></div>
   <div class="r"><span>B</span><div><b>Pitch live on Teams</b><p class="wc" style="text-align:left;margin:4px 0 0">Shy, or no phone or quiet room? Pitch to Nadia in a Teams call. The call is recorded; that recording is your video.</p></div></div></div></div></div>`},
 {nav:'A · Record',html:()=>`<div><div class="kick">Option A</div><h2>Record it with your phone</h2>
  <ol class="how"><li><span><b>Light:</b> face a window or lamp, not your back to it.</span></li><li><span><b>Frame:</b> eyes on the top third line, phone at eye level, stable.</span></li><li><span><b>Sound:</b> a quiet room, phone about one arm away.</span></li><li><span><b>Take:</b> one continuous take, no cuts or music needed.</span></li><li><span><b>Check:</b> watch it once. If it runs over 45 s, cut words, not speed.</span></li></ol></div>
  <div class="vis"><span class="lbl">Good framing</span><div class="paper" style="justify-items:center"><div class="phone" aria-hidden="true"><span class="rec">● REC</span><div class="third" style="top:33%"></div><div class="third" style="top:66%"></div><div class="face"></div><div class="body"></div></div><div class="wc">Eyes on the top line · head and shoulders · plain background</div></div></div>`},
 {nav:'B · Teams',html:()=>`<div><div class="kick">Option B</div><h2>Pitch live on Teams</h2>
  <ol class="how"><li><span><b>Tell Nadia</b> in class or by Teams message by <b>Friday 27 Nov</b>. She sends you a time.</span></li><li><span><b>Join</b> from a quiet place, camera on, face visible.</span></li><li><span><b>Pitch</b> once, 30–45 seconds. Nadia records the call.</span></li><li><span><b>Done.</b> The recording is your submission. Nothing to upload.</span></li></ol>
  <div class="acts"><button type="button" class="b" data-go="6">Checklist →</button></div></div>
  <div class="vis"><span class="lbl">On the call</span><div class="paper"><div class="gx">${[['Camera on','Your face is part of the pitch.'],['One try','Like a recording: speak once, start to end.'],['Same marks','Hook, problem, solution, proof, ask, delivery.'],['No pressure','Only you and Nadia in the call.']].map(([t,d],i)=>`<div class="r"><span>${i+1}</span><div><b>${t}</b><p class="wc" style="text-align:left;margin:4px 0 0">${d}</p></div></div>`).join('')}</div></div></div>`},
 {nav:'Submit',html:()=>`<div><div class="kick">Tue 1 Dec · 23:59 <span class="mk">Activities 1 and 2 · 20%</span></div><h2>Check and submit</h2>
  <ul class="ck">${['Activity 1: my script is uploaded on Moodle as a Word file','30–45 seconds','My face is visible and the sound is clear','Hook, problem, solution, proof, ask: all five are there','One number, and it is true','Option A: file named Name_StudentID_Pitch.mp4 · Option B: my Teams pitch is done'].map((c,i)=>`<li><label><input type="checkbox" data-ck="${i}"> ${c}</label></li>`).join('')}</ul>
  <div class="acts" style="margin-top:18px"><button type="button" class="b g" onclick="saveWord()">Save script as Word ⤓</button>${MOODLE1?`<a class="b" href="${esc(MOODLE1)}" target="_blank" rel="noopener">Activity 1 · Upload script ↗</a>`:''}${MOODLE?`<a class="b" href="${esc(MOODLE)}" target="_blank" rel="noopener">Activity 2 · Upload video ↗</a>`:`<span class="b" aria-disabled="true">Moodle link coming soon</span>`}</div></div>
  <div class="vis"><span class="lbl">Activity 1 · script · 10</span><div class="mbar">${[['Hook',2],['Problem',2],['Solution',2],['Proof',2],['Ask',1],['75–110 words',1]].map(([t,m])=>`<div><span>${t}</span><span><i style="width:${m*33}%"></i></span><span>${m}</span></div>`).join('')}</div>
  <span class="lbl" style="margin-top:14px;display:block">Activity 2 · video or Teams · 10</span><div class="mbar">${[['Hook',2],['Problem + solution',3],['Proof',2],['Delivery',2],['Ask',1]].map(([t,m])=>`<div><span>${t}</span><span><i style="width:${m*33}%"></i></span><span>${m}</span></div>`).join('')}</div>
  <p class="wc" style="margin-top:10px">Delivery: clear voice, eye contact, within 30–45 seconds.</p></div>`,
  after:el=>{ el.querySelectorAll('[data-ck]').forEach(c=>{ const k='ent142-a2-ck'+c.dataset.ck; try{ c.checked=localStorage.getItem(k)==='1'; }catch(e){} c.onchange=()=>{ try{ localStorage.setItem(k,c.checked?'1':'0'); }catch(e){} }; }); }}
];
let timer=null, exMode=false;
function prompter(el){ const pr=el.querySelector('#pr'); const txt=script(exMode); pr.textContent=txt||'Write your script in Step 1, or use the example script.';
  el.querySelector('#useEx').onclick=()=>{ exMode=!exMode; el.querySelector('#useEx').textContent=exMode?'Use my script':'Use the example script'; prompter(el); };
  el.querySelector('#go').onclick=()=>{ clearInterval(timer); const t0=performance.now(), tb=el.querySelector('#tb'), tt=el.querySelector('#tt'), b=el.querySelector('#go'); b.textContent='■ Stop';
    const stop=()=>{ clearInterval(timer); timer=null; b.textContent='▶ Start the timer'; b.onclick=()=>prompter(el)||el.querySelector('#go').click(); };
    timer=setInterval(()=>{ const s=(performance.now()-t0)/1000; tt.textContent=s.toFixed(1)+' s'+(s<30?'':s<=45?' · in range':' · too long'); tb.style.width=Math.min(100,s/45*100)+'%'; tb.style.background=s>45?'#B23A2E':s>=30?'#2E7D5B':''; pr.scrollTop=(pr.scrollHeight-pr.clientHeight)*Math.min(1,s/40); if(s>60) stop(); },100);
    b.onclick=stop; }; }
const wc=()=>{ const n=ids.reduce((a,id)=>a+Deck.words(Deck.get(id)),0); const w=document.getElementById('wc'); if(w) w.innerHTML=`<b>${n}</b> words ≈ <b>${Math.round(n/150*60)}</b> seconds · aim for 75–110 words`; };
Deck.mount({slides:SL,key:'ent142-a2',onInput:()=>wc()});
</script>
</body>
</html>
