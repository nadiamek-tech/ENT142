<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project 1 · Report · ENT 142</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<link rel="stylesheet" href="assets/portal.css">
<link rel="stylesheet" href="assets/lab.css">
<link rel="stylesheet" href="assets/report.css">
<style>
:root{--wk:#B4521E;--wk-soft:rgba(180,82,30,.09);--wk-d:#F2A06B;--wk-soft-d:rgba(242,160,107,.14)}
body{font-family:var(--f-display);background:var(--bg);color:var(--ink);margin:0}
.deck{max-width:1120px;margin:0 auto;padding:18px 16px 110px}
.sl-f{display:none;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 32px;min-height:min(640px,calc(100vh - 190px));grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center}
.sl-f.on{display:grid;animation:in .25s ease}
.sl-f.one{grid-template-columns:minmax(0,1fr)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kick{font:600 .78rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--wk);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kick .mk{background:var(--wk-soft);border-radius:999px;padding:3px 10px;color:var(--ink);letter-spacing:.03em;text-transform:none;font-family:var(--f-display);font-weight:700}
.sl-f h2{font-size:clamp(1.8rem,4.2vw,2.8rem);line-height:1.05;letter-spacing:-.015em;margin:10px 0 12px}
.what{font-size:1.15rem;line-height:1.45;margin:0 0 18px;max-width:34em}
.how{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:10px;counter-reset:h}
.how li{counter-increment:h;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:1.02rem;line-height:1.35}
.how li::before{content:counter(h);width:30px;height:30px;border-radius:50%;background:var(--wk);color:var(--on-wk,#fff);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.how-t{font:700 .8rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.b{font:700 .98rem var(--f-display);border:1.5px solid var(--wk);background:var(--wk);color:var(--on-wk,#fff);border-radius:999px;padding:10px 18px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.b.g{background:transparent;color:var(--ink);border-color:var(--line)}
.b.g:hover{border-color:var(--wk)}
.b[aria-disabled=true]{background:var(--line);border-color:var(--line);color:var(--muted);cursor:default}
.vis{position:relative;display:grid;gap:10px}
.vis .lbl{font:600 .75rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.vis-in{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:14px;align-items:start}
.where{display:grid;gap:4px;justify-items:center;font:600 .7rem var(--f-mono);color:var(--muted);text-transform:uppercase;text-align:center}
.mini{zoom:.44;pointer-events:none}
.mini-w{max-height:460px;overflow:hidden;border-radius:10px;mask-image:linear-gradient(#000 85%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chips span{border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.chips span b{color:var(--wk)}
/* road map */
.road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.road button{font:inherit;color:inherit;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;cursor:pointer;display:grid;gap:6px;position:relative}
.road button:hover{border-color:var(--wk)}
.road .n{width:30px;height:30px;border-radius:50%;background:var(--wk);color:var(--on-wk,#fff);display:grid;place-items:center;font-weight:800}
.road b{font-size:1.02rem}
.road small{font:600 .74rem var(--f-mono);color:var(--muted)}
.road .ok{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;background:#2E7D5B;color:#fff;font-size:12px;display:none;place-items:center;font-weight:800}
.road .done .ok{display:grid}
/* get ready */
.ready{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ready>div{border:1.5px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px;align-content:start;background:var(--bg)}
.ready h3{margin:0;font-size:1.25rem}
.ready p{margin:0;color:var(--muted)}
.ready .ic{color:var(--wk);line-height:0}
/* speakers, marks */
.spk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.spk div{border-radius:14px;background:var(--wk-soft);padding:14px;text-align:center;display:grid;gap:6px;justify-items:center}
.spk .av{width:46px;height:46px;border-radius:50%;background:var(--wk);color:var(--on-wk,#fff);display:grid;place-items:center;font-weight:800;font-size:1.1rem}
.spk small{color:var(--muted);font-weight:600}
.mbar{display:grid;gap:8px}
.mbar div{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-weight:700;font-size:.95rem}
.mbar i{display:block;height:16px;border-radius:8px;background:var(--wk)}
.mbar span:last-child{font:600 .85rem var(--f-mono);color:var(--muted)}
details.rb{margin-top:10px}
details.rb>summary{cursor:pointer;font-weight:700;color:var(--wk)}
/* nav */
.dnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.dnav-in{max-width:1120px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:700 .75rem var(--f-mono);cursor:pointer;padding:0}
.dots button.on{background:var(--wk);border-color:var(--wk);color:var(--on-wk,#fff)}
.dots button.part{border-color:color-mix(in srgb,var(--wk) 45%,var(--line))}
.nb{font:700 .95rem var(--f-display);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap}
.nb.next{background:var(--wk);border-color:var(--wk);color:var(--on-wk,#fff)}
.nb:disabled{opacity:.35;cursor:default}
.ca-btn,.ls-btn{bottom:84px!important}
@media (max-width:860px){
  .sl-f.on{grid-template-columns:minmax(0,1fr);padding:22px 18px;gap:22px;min-height:0}
  .road,.ready,.spk{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dots{display:none}
  .dnav-in{justify-content:space-between}
  .pos{display:inline!important}
  .mbar div{grid-template-columns:100px 1fr 40px}
}
@media (max-width:420px){.ready{grid-template-columns:minmax(0,1fr)}.vis-in{grid-template-columns:minmax(0,1fr) 64px}}
.pos{display:none;font:600 .85rem var(--f-mono);color:var(--muted)}
</style>
</head>
<body>
<div id="hub" data-cur="project"></div>
<main class="deck" id="deck"></main>
<nav class="dnav" aria-label="Slides"><div class="dnav-in"><button type="button" class="nb prev">← Back</button><div class="dots" id="dots"></div><span class="pos" id="pos"></span><button type="button" class="nb next">Next →</button></div></nav>
<style>
.stack{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.stack .mini2{zoom:.5;pointer-events:none}
.stack .mini2 .rp-pg{max-height:none!important;mask-image:none!important;-webkit-mask-image:none!important;min-height:780px}
.stack>div{border-radius:6px;overflow:hidden;max-height:400px}
.stack>div:last-child{margin-top:28px}
.ready{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.ready{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.ready{grid-template-columns:minmax(0,1fr)}}
.outl{margin:0;padding-left:1.2em;display:grid;gap:6px;font-weight:600}
</style>
<script src="assets/supports.js"></script>
<script src="assets/course.js"></script>
<script src="assets/kb.js"></script>
<script src="assets/search-index.js"></script>
<script src="assets/assistant.js"></script>
<script src="assets/professor.js"></script>
<script src="assets/course-info.js"></script>
<script src="assets/portal.js"></script>
<script>window.LAB_NO_MOUNT=true;</script>
<script src="assets/lab.js"></script>
<script src="assets/report.js"></script>
<script>
Portal.header('project');
const esc2=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REG=(COURSE.links&&COURSE.links.reg)||'';
const MOODLE=((COURSE.assess.find(a=>a.id==='p1')||{}).submit||{}).link||'';
const askBtn=q=>`<button type="button" class="b g" data-ask="${esc2(q)}">Ask me: ${esc2(q)}</button>`;
const helpBtn=(t,u)=>`<a class="b g" href="${u}">Help: ${esc2(t)} →</a>`;
const SV=d=>`<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

/* one slide per report section, in the brief's order */
const PARTS={
 exec:{what:'One page that tells the whole story. Read first, written last.',
  how:['Write it after every other section.','One sentence each: problem, solution, customer, evidence, money, impact, next step.','Keep it to one page. It is not counted in the 4000 words.'],
  help:[['Validation scorecard','report-lab.html#s12']],ask:'What should our executive summary say?'},
 intro:{what:'The problem you chose, why it matters, and how your team reached the idea.',
  how:['Open with one verified number about the problem.','Describe your creative process (Week 2 tools, Week 5 test).','Say what the report will show. Maximum 250 words.'],
  help:[['Week 2 lecture','week-02.html']],ask:'How long is the introduction?'},
 concept:{what:'Your idea, the opportunity behind it, and the change it will make.',
  how:['Show problem today → your solution → impact.','Name two similar ventures and what you do differently.','Back the opportunity with one verified number.'],
  help:[['Week 2 lecture','week-02.html']],ask:'How do I know if data is reliable?'},
 market:{what:'How big the market is, and how much of it you can reach in year one.',
  how:['Start from a verified total: TAM.','Set SAM % and SOM %, and label them as assumptions.','Multiply by the yearly spend per customer.'],
  help:[['Find verified data','report-lab.html#s2']],ask:'What is TAM SAM SOM?'},
 customer:{what:'Who your customer is, how serious the problem is for them, and what you learned by testing.',
  how:['Describe one customer group precisely.','Prove how many and how serious with two data cards.','Show assumption → evidence → what you changed.'],
  help:[['Week 3 lecture','week-03.html']],ask:'Do we need a survey or interviews?'},
 compet:{what:'Who else solves this problem, and where your venture stands.',
  how:['List 3 competitors: direct, indirect, substitute.','Score everyone 1–5 on two things customers care about.','Draw the positioning map and name your gap.'],
  help:[],ask:'What is a positioning map?'},
 model:{what:'Who pays, how the venture makes money, and its impact on people and planet.',
  how:['State who pays, for what, and how much.','Compare monthly revenue with costs.','Add one people and one planet indicator, and your biggest risk.'],
  help:[['Week 4 lecture','week-04.html']],ask:'What is break-even?'},
 proto:{what:'What you built, how you tested it, and what you changed.',
  how:['Name the assumption you tested.','Report version 1 and the test result, with numbers.','Show version 2 and the photos.'],
  help:[['Prototype Helper','week-05.html#s3']],ask:'Which prototype should we build?'},
 learn:{what:'What each member learned, and whether this is a true opportunity.',
  how:['Each member: before, what I did, what I can do now.','Answer as a team: is this a true opportunity?','Give the reason, using your scorecard.'],
  help:[],ask:'What goes in Learning and Adaptation?'}
};

const S2=[];
/* 0 · what */
S2.push({nav:'What',html:`<div><div class="kick">Project 1</div><h2>What is the project?</h2>
  <p class="what">Your team turns its idea into a social enterprise and writes one report proving it can work, with real data and a tested prototype.</p>
  <div class="chips"><span>Team of 4–5</span><span>Report <b>40%</b></span><span>Presentation <b>10%</b></span><span><b>4000</b> words</span><span>Due <b>Tue 27 Oct</b></span></div>
  <div class="acts"><button type="button" class="b" data-go="1">See the sections →</button><a class="b g" href="report.html">Open the report template</a></div></div>
  <div class="vis"><span class="lbl">Example of a finished report</span><div class="stack"><div><div class="mini2" id="ex-cov"></div></div><div><div class="mini2" id="ex-pg"></div></div></div></div>`,
  after:()=>{ Report.cover(document.getElementById('ex-cov'),true); Report.page(document.getElementById('ex-pg'),'market',true); }});
/* 1 · map */
S2.push({nav:'Map',one:true,html:`<div><div class="kick">Project 1 · the report</div><h2>9 sections, in this order</h2>
  <p class="what">Click a section to see how to write it. A tick means your team has drafted it in the Report Lab.</p>
  <div class="road">${Report.SECS.map((c,i)=>`<button type="button" data-go="${i+3}" class="${Report.done(c.key)?'done':''}"><span class="ok">✓</span><span class="n">${i+1}</span><b>${esc2(c.h)}</b><small>${c.target?(c.max?'max ':'≈ ')+c.target+' words':'1 page · not counted'}</small></button>`).join('')}
  <button type="button" data-go="${Report.SECS.length+4}"><span class="n">R</span><b>References</b><small>APA · from your data cards</small></button></div></div>`});
/* 2 · ready */
S2.push({nav:'Ready',one:true,html:`<div><div class="kick">Before you start</div><h2>Team, registration, idea, data</h2>
  <div class="ready">
   <div><span class="ic">${SV('<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c.6-3.3 3-5 6-5s5.4 1.7 6 5M15 15.5c2.6-.3 4.8 1.2 5.5 4.5"/>')}</span><h3>1 · Team</h3><p>4–5 students, formed in Week 2.</p></div>
   <div><span class="ic">${SV('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16l2 2 4-4"/>')}</span><h3>2 · Register</h3><p>One person registers the team, with a CUD account.</p>${REG?`<a class="b" href="${esc2(REG)}" target="_blank" rel="noopener">Register our team ↗</a>`:`<span class="b" aria-disabled="true">Link coming soon</span>`}</div>
   <div><span class="ic">${SV('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>')}</span><h3>3 · Venture card</h3><p>Your idea in five fields.</p><a class="b g" href="report-lab.html#s1">Fill it in →</a></div>
   <div><span class="ic">${SV('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>')}</span><h3>4 · Verified data</h3><p>At least 5 numbers from trusted sources.</p><a class="b g" href="report-lab.html#s2">Collect data →</a></div>
  </div></div>`});
/* 3–11 · sections */
Report.SECS.forEach((c,i)=>{ const p=PARTS[c.key];
  S2.push({nav:String(i+1),part:i+1,html:`<div><div class="kick">Section ${i+1} of 9 <span class="mk">${c.target?(c.max?'max ':'≈ ')+c.target+' words':'1 page · not counted'}</span></div><h2>${esc2(c.h)}</h2>
    <p class="what">${esc2(p.what)}</p><p class="how-t">How to write it</p><ol class="how">${p.how.map(h=>`<li>${esc2(h)}</li>`).join('')}</ol>
    <div class="acts"><a class="b" href="report-lab.html#s${c.lab}">Write it in the Report Lab →</a>${p.help.map(([t,u])=>helpBtn(t,u)).join('')}${p.ask?askBtn(p.ask):''}</div></div>
    <div class="vis"><span class="lbl">Example</span><div class="vis-in"><div class="zx"></div><div class="where">${Report.thumb(c.key)}In the report</div></div></div>`,
    after:el=>Report.page(el.querySelector('.zx'),c.key,true)}); });
/* 12 · presentation */
S2.push({nav:'Present',html:`<div><div class="kick">Tue 27 Oct <span class="mk">Presentation · 10%</span></div><h2>Present your venture</h2>
  <p class="what">1 minute each, then 2 minutes of questions for the team. PowerPoint. Each of you is marked on your own.</p><p class="how-t">Outline (brief)</p>
  <ol class="outl"><li>Cover slide with team name, and students' names/ID numbers</li><li>Introduction of each member of the team</li><li>The Problem &amp; Solution</li><li>Market Opportunity and Innovation</li><li>Impact of the Solution</li><li>Presentation and Pitch</li></ol>
  <div class="acts" style="margin-top:18px"><a class="b" href="presentation.html">Presentation tips →</a></div></div>
  <div class="vis"><span class="lbl">Example: a team of five, one minute each</span><div class="spk" style="grid-template-columns:repeat(5,minmax(0,1fr))">${[['A','Cover + team'],['B','Problem & solution'],['C','Market'],['D','Impact'],['E','Pitch']].map(([a,t])=>`<div><span class="av">${a}</span><b>Student ${a}</b><small>${t}</small></div>`).join('')}</div>
  <details class="rb"><summary>How it is marked (syllabus)</summary>${rubHTML(RUB_PRES)}</details></div>`});
/* 13 · submit */
S2.push({nav:'Submit',html:`<div><div class="kick">Tue 27 Oct <span class="mk">Report · 40%</span></div><h2>References, submit and marks</h2>
  <p class="how-t">Before you submit</p>
  <ol class="how"><li>One Word file: cover page, contents, the 9 sections, references in APA.</li><li>About 4000 words, in your own words, with your figures and prototype photos.</li><li>One person uploads it on Moodle.</li></ol>
  <div class="acts"><a class="b g" href="report.html">Open our report</a><a class="b g" href="report-lab.html#s11">Final checks</a>${MOODLE?`<a class="b" href="${esc2(MOODLE)}" target="_blank" rel="noopener">Submit on Moodle ↗</a>`:`<span class="b" aria-disabled="true">Moodle link coming soon</span>`}</div></div>
  <div class="vis"><span class="lbl">Report marks · 100, adjusted to 40%</span><div class="mbar">${[['Knowledge',25],['Analysis',25],['Creativity',25],['Evaluation',25]].map(([t,m])=>`<div><span>${t}</span><span><i style="width:${m*4}%"></i></span><span>${m}</span></div>`).join('')}</div>
  <details class="rb"><summary>Full report rubric (syllabus)</summary>${rubHTML(RUB_SYL)}</details></div>`});

/* build and navigate */
const deck=document.getElementById('deck'), dots=document.getElementById('dots');
deck.innerHTML=S2.map((s,i)=>`<section class="sl-f${s.one?' one':''}" id="s${i}" aria-label="Slide ${i+1} of ${S2.length}">${s.html}</section>`).join('');
dots.innerHTML=S2.map((s,i)=>`<button type="button" class="${s.part?'part':''}" data-i="${i}" title="${esc2(s.part?Report.SECS[s.part-1].h:s.nav)}" aria-label="Slide ${i+1}">${s.part||'•'}</button>`).join('');
const secs=[...deck.children], built=new Set(); let cur=0;
function go(i,push){ if(i<0||i>=S2.length) return; cur=i; secs.forEach((s,k)=>s.classList.toggle('on',k===i));
  if(!built.has(i)&&S2[i].after){ S2[i].after(secs[i]); built.add(i); }
  dots.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===i));
  document.getElementById('pos').textContent=(i+1)+' / '+S2.length;
  document.querySelector('.prev').disabled=i===0; document.querySelector('.next').disabled=i===S2.length-1;
  if(push!==false) try{ history.replaceState(null,'','#s'+i); }catch(e){} window.scrollTo({top:0}); }
document.querySelector('.prev').addEventListener('click',()=>go(cur-1));
document.querySelector('.next').addEventListener('click',()=>go(cur+1));
dots.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) go(+b.dataset.i); });
deck.addEventListener('click',e=>{ const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(+g.dataset.go); }
  const a=e.target.closest('[data-ask]'); if(a&&window.ENT142Assistant) ENT142Assistant.open(a.dataset.ask); });
document.addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return; if(e.key==='ArrowRight') go(cur+1); if(e.key==='ArrowLeft') go(cur-1); });
let tx=null; deck.addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; },{passive:true});
deck.addEventListener('touchend',e=>{ if(tx==null) return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>70) go(cur+(d<0?1:-1)); tx=null; });
const fromHash=()=>{ const m=location.hash.match(/^#s(\d+)$/); go(m?Math.min(+m[1],S2.length-1):0,false); };
window.addEventListener('hashchange',fromHash); fromHash();
</script>
</body>
</html>
